name: ci-build
run-name: .NET CI Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.github/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '.github/**'
  schedule:
    - cron: "30 7 * * 1"

jobs:
  unit-test:
    name: Build and unit tests
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          ref: ${{ github.head_ref || github.ref }}

    - name: Set CI Build status to pending
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
         ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }} \
        -d '{"state":"pending","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","description":"CI Build is pending!","context":"continuous-integration/build"}'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: |
          global.json
          Source/Directory.Packages.props
          Source/Directory.Build.props
          Source/**/*.csproj

    - name: Restore dependencies
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        dotnet restore Source/ROOT.Zfs.slnx

    - name: Build solution
      run: dotnet build Source/ROOT.Zfs.slnx --no-restore

    - name: Create coverage directory
      run: mkdir -p coverage

    - name: Run unit tests with coverage
      run: dotnet test Source/**/*.Tests.csproj --configuration Debug --no-restore --verbosity normal --filter "TestCategory!=Integration" /p:AltCover=true /p:AltCoverReport="${{ github.workspace }}/coverage/coverage.opencover-unit.xml" /p:AltCoverAttributeFilter=ExcludeFromCodeCoverage /p:AltCoverVisibleBranches=true

    - name: Upload unit test coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-unit
        path: coverage/coverage.opencover-unit.xml
        archive: true

    - name: Set CI Build status to success
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
         ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }} \
        -d '{"state":"success","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","description":"CI Build succeeded!","context":"continuous-integration/build"}'

    - name: Set CI Build status to failure
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: failure()
      run: |
        curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
         ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }} \
        -d '{"state":"failure","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","description":"CI Build failed!","context":"continuous-integration/build"}'

  integration-test:
    name: Integration tests on Ubuntu ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [22.04, 24.04]
    runs-on: ubuntu-${{ matrix.os }}

    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          ref: ${{ github.head_ref || github.ref }}

    - name: Set Integration tests status to pending
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
         ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }} \
        -d '{"state":"pending","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","description":"Integration tests is pending!","context":"continuous-integration/integration"}'

    - name: Install ZFS and smartmontools
      run: |
        sudo apt-get update
        sudo apt install -y smartmontools
        sudo apt install -y zfsutils-linux
        which zfs
        which zpool
        which smartctl
        which ls
        which lsblk
        sudo zpool status

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: |
          global.json
          Source/Directory.Packages.props
          Source/Directory.Build.props
          Source/**/*.csproj

    - name: Restore dependencies
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        dotnet restore Source/ROOT.Zfs.slnx

    - name: Build solution
      run: dotnet build Source/ROOT.Zfs.slnx --no-restore --configuration Debug

    - name: Run integration tests
      run: dotnet test Source/**/*.Tests.csproj --configuration Debug --no-restore --verbosity normal --filter "TestCategory=Integration"

    - name: Set Integration tests status to success
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
         ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }} \
        -d '{"state":"success","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","description":"Integration tests succeeded!","context":"continuous-integration/integration"}'

    - name: Set Integration tests status to failure
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: failure()
      run: |
        curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
         ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }} \
        -d '{"state":"failure","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","description":"Integration tests failed!","context":"continuous-integration/integration"}'

    - name: Clean up test pool
      if: always()
# Cleans up potential left over from tests failing
      run: sudo rm -rf /tmp/zfs-pool
      continue-on-error: true

  integration-test-coverage:
    name: Integration tests with coverage on Ubuntu 26.04
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          ref: ${{ github.head_ref || github.ref }}

    - name: Set Integration tests status to pending
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
         ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }} \
        -d '{"state":"pending","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","description":"Integration tests is pending!","context":"continuous-integration/integration"}'

    - name: Install ZFS and smartmontools
      run: |
        sudo apt-get update
        sudo apt install -y smartmontools
        sudo apt install -y zfsutils-linux
        which zfs
        which zpool
        which smartctl
        which ls
        which lsblk
        sudo zpool status

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: |
          global.json
          Source/Directory.Packages.props
          Source/Directory.Build.props
          Source/**/*.csproj

    - name: Restore dependencies
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        dotnet restore Source/ROOT.Zfs.slnx

    - name: Build solution
      run: dotnet build Source/ROOT.Zfs.slnx --no-restore --configuration Debug

    - name: Create coverage directory
      run: mkdir -p coverage

    - name: Run integration tests with coverage
      run: dotnet test Source/**/*.Tests.csproj --configuration Debug --no-restore --verbosity normal --filter "TestCategory=Integration" /p:AltCover=true /p:AltCoverReport="${{ github.workspace }}/coverage/coverage.opencover-integration.xml" /p:AltCoverAttributeFilter=ExcludeFromCodeCoverage /p:AltCoverVisibleBranches=true

    - name: Upload integration test coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-integration
        path: coverage/coverage.opencover-integration.xml
        archive: true

    - name: Set Integration tests status to success
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
         ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }} \
        -d '{"state":"success","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","description":"Integration tests succeeded!","context":"continuous-integration/integration"}'

    - name: Set Integration tests status to failure
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: failure()
      run: |
        curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
         ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }} \
        -d '{"state":"failure","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","description":"Integration tests failed!","context":"continuous-integration/integration"}'

    - name: Clean up test pool
      if: always()
# Cleans up potential left over from tests failing
      run: sudo rm -rf /tmp/zfs-pool
      continue-on-error: true

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-26.04
    # Only the coverage leg is required; the 22.04/24.04 matrix can finish in parallel.
    needs: [unit-test, integration-test-coverage]
    if: always()

    steps:
    - name: Set SonarCloud quality gate status to pending
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
         ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }} \
        -d '{"state":"pending","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","description":"The quality gate is pending!","context":"continuous-integration/sonarcloud"}'

    - name: Verify prerequisite test jobs succeeded
      if: needs.unit-test.result != 'success' || needs.integration-test-coverage.result != 'success'
      run: |
        echo "Unit test result: ${{ needs.unit-test.result }}"
        echo "Integration coverage test result: ${{ needs.integration-test-coverage.result }}"
        exit 1

    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          ref: ${{ github.head_ref || github.ref }}

    - name: Download coverage reports
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: coverage-*
        merge-multiple: true
        path: coverage

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: |
          global.json
          Source/Directory.Packages.props
          Source/Directory.Build.props
          Source/**/*.csproj

    - name: Set up JDK 17 for SonarCloud
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '17'
        distribution: 'oracle'

    - name: Install SonarCloud scanner
      run: |
        dotnet tool install --global dotnet-sonarscanner

    - name: Restore dependencies
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        dotnet restore Source/ROOT.Zfs.slnx

    - name: Prepare SonarCloud analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet-sonarscanner begin /k:"bjornbouetsmith_ROOT.Zfs" /o:"bjornbouetsmith" /d:sonar.login="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/coverage/coverage.opencover*.xml" /d:sonar.qualitygate.wait=true

    - name: Build solution
      run: dotnet build Source/ROOT.Zfs.slnx --no-restore --configuration Debug

    - name: Analyze with SonarCloud
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet-sonarscanner end /d:sonar.login="$SONAR_TOKEN"

    - name: Set SonarCloud quality gate status to success
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
         ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }} \
        -d '{"state":"success","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","description":"The quality gate succeeded!","context":"continuous-integration/sonarcloud"}'

    - name: Set SonarCloud quality gate status to failure
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: failure()
      run: |
        curl \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
         ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }} \
        -d '{"state":"failure","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","description":"The quality gate failed!","context":"continuous-integration/sonarcloud"}'
